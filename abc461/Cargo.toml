[profile.dev]
opt-level = 3

[package]
name = "abc461"
version = "0.1.0"
edition = "2021"

[package.metadata.cargo-compete.bin]
abc461-a = { alias = "a", problem = "https://atcoder.jp/contests/abc461/tasks/abc461_a" }
abc461-b = { alias = "b", problem = "https://atcoder.jp/contests/abc461/tasks/abc461_b" }
abc461-c = { alias = "c", problem = "https://atcoder.jp/contests/abc461/tasks/abc461_c" }
abc461-d = { alias = "d", problem = "https://atcoder.jp/contests/abc461/tasks/abc461_d" }
abc461-e = { alias = "e", problem = "https://atcoder.jp/contests/abc461/tasks/abc461_e" }
abc461-f = { alias = "f", problem = "https://atcoder.jp/contests/abc461/tasks/abc461_f" }
abc461-g = { alias = "g", problem = "https://atcoder.jp/contests/abc461/tasks/abc461_g" }

[[bin]]
name = "abc461-a"
path = "src/bin/a.rs"

[[bin]]
name = "abc461-b"
path = "src/bin/b.rs"

[[bin]]
name = "abc461-c"
path = "src/bin/c.rs"

[[bin]]
name = "abc461-d"
path = "src/bin/d.rs"

[[bin]]
name = "abc461-e"
