superslice = "=1.0.0"
petgraph = "=0.8.2"
indexmap = "=2.11.0"
regex = "=1.11.2"
rustc-hash = "=2.1.1"
bitvec = "=1.0.1"
counter = "=0.7.0"
getrandom = "=0.3.3"

